name: Deploy

# Every push to main rebuilds every interactive and uploads it. The three static ones
# are Cloudflare Pages projects; Telephone keeps server state, so it is a Worker with a
# Durable Object and deploys with `wrangler deploy` instead. Pull requests run the same
# checks without deploying.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Exact versions from the committed lockfile. See README.md > Dependency policy.
      - run: npm ci

      - run: npm audit signatures

      - run: npm run typecheck

      - run: npm test

      # Builds all workspaces -> nim/dist, milk/dist, poster/dist, telephone/dist
      - run: npm run build

      - name: Deploy nim
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy nim/dist --project-name=cpatgt-nim --branch=main

      - name: Deploy milk
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy milk/dist --project-name=cpatgt-milk --branch=main

      - name: Deploy poster
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy poster/dist --project-name=cpatgt-poster --branch=main

      # Not a Pages project: Telephone serves its own client from the same worker that
      # serves /api, so that the game lives on one origin. Sessions are held in a cookie
      # and in localStorage, both origin-scoped, and a second origin would mean every
      # phone in the room losing its seat at once.
      - name: Deploy telephone
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: telephone
          command: deploy
